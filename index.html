<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnet de vocabulaire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { background: #1b2430; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; }

  .carnet-root {
    --ink: #1b2430;
    --ink-2: #242f3f;
    --parchment: #ede6d6;
    --parchment-2: #e2d9c3;
    --brass: #b8935f;
    --brass-light: #d4b483;
    --red: #b8433a;
    --green: #6f8f6a;
    --text-light: #f2ede1;
    --text-dim: #9aa4b2;

    font-family: 'IBM Plex Mono', monospace;
    background: var(--ink);
    color: var(--text-light);
    min-height: 100vh;
    padding: 32px 16px 100px;
    position: relative;
  }

  .carnet-header {
    max-width: 480px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--ink-2);
    padding-bottom: 14px;
  }

  .carnet-title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--text-light);
    letter-spacing: 0.2px;
  }

  .carnet-title span {
    color: var(--brass-light);
    font-style: italic;
  }

  .carnet-stats {
    max-width: 480px;
    margin: 0 auto 28px;
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .carnet-stats b {
    color: var(--text-light);
    font-size: 15px;
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
  }

  .stage {
    max-width: 480px;
    margin: 0 auto;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 400px;
    min-height: 220px;
    background: var(--parchment);
    color: var(--ink);
    border-radius: 3px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.5);
    position: relative;
    transition: transform 0.15s ease;
    border: 1px solid var(--parchment-2);
  }

  .card:active { transform: scale(0.985); }

  .card-tag {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--brass);
    font-weight: 600;
  }

  .card-box {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 10px;
    color: #8a8272;
  }

  .card-word {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .card-sub {
    font-size: 13px;
    color: #6b6455;
    font-style: italic;
  }

  .card-hint {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #a89f8a;
    text-transform: uppercase;
  }

  .grade-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    margin-top: 18px;
  }

  .grade-btn {
    flex: 1;
    padding: 15px 0;
    border-radius: 3px;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  .grade-btn.no { background: rgba(184,67,58,0.15); color: #e08b83; border: 1px solid rgba(184,67,58,0.4); }
  .grade-btn.yes { background: rgba(111,143,106,0.18); color: #a9c7a2; border: 1px solid rgba(111,143,106,0.4); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    max-width: 320px;
  }

  .empty-state .big {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .fab {
    position: fixed;
    bottom: 28px;
    right: 50%;
    transform: translateX(228px);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--brass);
    color: var(--ink);
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.6);
  }

  @media (max-width: 540px) {
    .fab { right: 24px; transform: none; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,20,0.85);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }

  .sheet {
    background: var(--ink-2);
    width: 100%;
    max-width: 480px;
    border-radius: 14px 14px 0 0;
    padding: 24px 20px 32px;
    max-height: 86vh;
    overflow-y: auto;
  }

  .sheet-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sheet-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    letter-spacing: 0.03em;
  }

  .field input {
    width: 100%;
    background: var(--ink);
    border: 1px solid #3a4658;
    color: var(--text-light);
    padding: 11px 12px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }

  .field input:focus { outline: 1px solid var(--brass); border-color: var(--brass); }

  .submit-btn {
    width: 100%;
    padding: 13px 0;
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }

  .deck-list { margin-top: 4px; }

  .deck-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #2c3646;
    font-size: 13px;
  }

  .deck-row .fr { font-family: 'Fraunces', serif; font-size: 15px; }
  .deck-row .ru { color: var(--text-dim); }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: none;
    border: 1px solid #3a4658;
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }

  .tab-btn.active { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 600; }

  .filter-label {
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .filter-group { margin-bottom: 22px; }

  .schedule-bar {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 16px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #6b7383;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 18px;
  }
  .schedule-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }
  .schedule-row .label { color: #b8935f; font-weight: 600; }
  .schedule-row .room { color: #5a6272; }
  .schedule-row .countdown { color: #d4b483; }

  .import-area {
    width: 100%;
    min-height: 140px;
    background: var(--ink);
    border: 1px solid #3a4658;
    color: var(--text-light);
    padding: 11px 12px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    resize: vertical;
  }
  .import-area:focus { outline: 1px solid var(--brass); border-color: var(--brass); }

  .import-hint {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .import-hint code {
    background: #10151d;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--brass-light);
  }

  .file-drop {
    border: 1px dashed #3a4658;
    border-radius: 4px;
    padding: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
    cursor: pointer;
    display: block;
  }
  .file-drop:hover { border-color: var(--brass); color: var(--text-light); }

  .import-result {
    margin-top: 12px;
    font-size: 12px;
    color: var(--brass-light);
  }

  .loading { text-align: center; color: var(--text-dim); padding: 60px 0; }
</style>
</head>
<body>
<div class="schedule-bar" id="schedule-bar"></div>
<div class="carnet-root" id="root">
  <div class="loading">Открываю карне...</div>
</div>

<script>
(function () {
  // ---- Supabase connection ----
  const SUPA_URL = 'https://bbtnermtgmceczxjzhbl.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJidG5lcm10Z21jZWN6eGp6aGJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTg1NjcsImV4cCI6MjEwNDM5NDU2N30.fJp51af9yFuCVSSceX8BT4TmhXdzxHuy9UvFWYG-cec';

  function supaHeaders(extra) {
    return Object.assign({
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  async function dbFetchCards() {
    const res = await fetch(SUPA_URL + '/rest/v1/cards?select=*&order=created_at.asc', { headers: supaHeaders() });
    if (!res.ok) throw new Error('fetch cards failed: ' + res.status);
    return await res.json();
  }

  async function dbInsertCards(rows) {
    if (!rows || !rows.length) return;
    const res = await fetch(SUPA_URL + '/rest/v1/cards', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify(rows)
    });
    if (!res.ok) throw new Error('insert failed: ' + await res.text());
  }

  async function dbUpdateCard(id, patch) {
    const res = await fetch(SUPA_URL + '/rest/v1/cards?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: supaHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify(patch)
    });
    if (!res.ok) throw new Error('update failed: ' + await res.text());
  }

  async function dbDeleteCard(id) {
    const res = await fetch(SUPA_URL + '/rest/v1/cards?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: supaHeaders()
    });
    if (!res.ok) throw new Error('delete failed: ' + await res.text());
  }

  async function dbGetMeta(key) {
    const res = await fetch(SUPA_URL + '/rest/v1/meta?key=eq.' + encodeURIComponent(key) + '&select=value', { headers: supaHeaders() });
    if (!res.ok) throw new Error('meta fetch failed');
    const arr = await res.json();
    return arr.length ? arr[0].value : null;
  }

  async function dbSetMeta(key, value) {
    const res = await fetch(SUPA_URL + '/rest/v1/meta', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ key: key, value: value }])
    });
    if (!res.ok) throw new Error('meta set failed: ' + await res.text());
  }

  // ---- App logic (same shape as the in-chat version) ----
  const INTERVALS = [0, 1, 3, 7, 16]; // days, by box index 0-4

  const AUTO_IMPORT = [
    { id: 'test-version-check-1', tag: 'проверка версии', course: 'Тест', words: [
      { front: 'тестовое слово', back: 'mot test', tr: 'мо тэст' },
    ]},
    { id: 'test-multi-lesson-1', tag: 'урок 1', course: 'ТестУроки', words: [
      { front: 'один (тест)', back: 'un (test)', tr: 'эн тэст' },
    ]},
    { id: 'test-multi-lesson-2', tag: 'урок 2', course: 'ТестУроки', words: [
      { front: 'два (тест)', back: 'deux (test)', tr: 'дё тэст' },
    ]},
    { id: 'test-multi-lesson-3', tag: 'урок 3', course: 'ТестУроки', words: [
      { front: 'три (тест)', back: 'trois (test)', tr: 'труа тэст' },
    ]},
  ];

  const STARTER = [
    { front: 'телевизор', back: 'la télé', tr: 'ля тэлэ', tag: 'урок 1', course: 'Assimil' },
    { front: 'звонить', back: 'téléphoner', tr: 'тэлефонэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'искать', back: 'chercher', tr: 'шершэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'друзья', back: 'les amis', tr: 'лезами́', tag: 'урок 1', course: 'Assimil' },
    { front: 'деревня', back: 'la campagne', tr: 'ля кампа́нь', tag: 'урок 1', course: 'Assimil' },
    { front: 'думать', back: 'penser', tr: 'пансэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'экзамены', back: 'les examens', tr: 'лезэгзамэ́н', tag: 'урок 1', course: 'Assimil' },
    { front: 'слушать', back: 'écouter', tr: 'экутэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'преподаватель', back: 'le professeur', tr: 'ля профэсёр', tag: 'урок 1', course: 'Assimil' },
    { front: 'заканчивать', back: 'finir', tr: 'фини́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'приходить', back: 'venir', tr: 'вёни́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'писать', back: 'écrire', tr: 'экри́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'покупать', back: 'acheter', tr: 'аштэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'книга', back: 'le livre', tr: 'лё ливр', tag: 'урок 1', course: 'Assimil' },
    { front: 'говорить', back: 'parler', tr: 'парлэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'брат', back: 'le frère', tr: 'лё фрэр', tag: 'урок 1', course: 'Assimil' },
    { front: 'работать', back: 'travailler', tr: 'травайе́', tag: 'урок 1', course: 'Assimil' },
    { front: 'приезжать', back: 'arriver', tr: 'аривэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'завтра', back: 'demain', tr: 'дёмэ́н', tag: 'урок 1', course: 'Assimil' },
    { front: 'жить (где-то)', back: 'habiter', tr: 'абитэ́', tag: 'урок 1', course: 'Assimil' }
  ];

  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function makeId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  let cards = [];
  let queue = [];
  let current = null;
  let flipped = false;
  let sheetOpen = null; // null | 'add' | 'list'
  let sheetTab = 'one'; // 'one' | 'import'
  let importResult = null;
  let courseFilter = 'Все';
  let tagFilter = 'Все';
  let loadError = false;
  let formCourse = 'Общее';
  let formTag = 'Общее';
  let formNewCourseMode = false;
  let formNewTagMode = false;

  const root = document.getElementById('root');

  async function load() {
    try {
      cards = await dbFetchCards();
      loadError = false;
    } catch (e) {
      loadError = true;
      render();
      return;
    }

    if (cards.length === 0) {
      let initialized = null;
      try { initialized = await dbGetMeta('initialized'); } catch (e) {}
      if (!initialized) {
        const seedRows = STARTER.map(c => ({
          id: makeId(), front: c.front, back: c.back, tr: c.tr, tag: c.tag,
          course: c.course || 'Общее', box: 0, next: todayISO()
        }));
        try {
          await dbInsertCards(seedRows);
          await dbSetMeta('initialized', '1');
          cards = seedRows;
        } catch (e) {}
      }
    }

    await applyAutoImports();
    buildQueue();
    render();
  }

  window.__retryLoad = function () { root.innerHTML = '<div class="loading">Пробую снова...</div>'; load(); };
  window.__restartQueue = function () { buildQueue(); render(); };

  async function applyAutoImports() {
    if (!AUTO_IMPORT.length) return;
    let doneIds = [];
    try {
      const raw = await dbGetMeta('auto_import_log');
      doneIds = raw ? JSON.parse(raw) : [];
    } catch (e) { doneIds = []; }

    const newRows = [];
    for (const batch of AUTO_IMPORT) {
      if (doneIds.includes(batch.id)) continue;
      for (const w of batch.words) {
        const dup = cards.some(c => c.front.toLowerCase() === w.front.toLowerCase() && c.back.toLowerCase() === w.back.toLowerCase());
        if (dup) continue;
        newRows.push({ id: makeId(), front: w.front, back: w.back, tr: w.tr || '', tag: batch.tag || '', course: batch.course || 'Общее', box: 0, next: todayISO() });
      }
      doneIds.push(batch.id);
    }
    if (newRows.length) {
      try {
        await dbInsertCards(newRows);
        cards = cards.concat(newRows);
      } catch (e) {}
    }
    try { await dbSetMeta('auto_import_log', JSON.stringify(doneIds)); } catch (e) {}
  }

  let isExtraMode = false;

  function buildQueue() {
    const t = todayISO();
    cards.forEach(c => { if (!c.course) c.course = 'Общее'; });
    const pool = filteredPool();
    const dueIds = pool.filter(c => c.next <= t).map(c => c.id);
    if (dueIds.length) {
      queue = dueIds;
      isExtraMode = false;
    } else if (pool.length) {
      queue = pool.map(c => c.id);
      isExtraMode = true;
    } else {
      queue = [];
      isExtraMode = false;
    }
    current = queue.length ? cards.find(c => c.id === queue[0]) : null;
    flipped = false;
  }

  function courseList() {
    const set = new Set(cards.map(c => c.course || 'Общее'));
    return ['Все'].concat(Array.from(set).sort());
  }

  function tagListForCourse(course) {
    const seen = [];
    cards.filter(c => (c.course || 'Общее') === course).forEach(c => {
      const t = c.tag || 'Общее';
      if (!seen.includes(t)) seen.push(t);
    });
    return seen;
  }

  function getLastChoice() {
    try {
      const raw = localStorage.getItem('carnet-last-choice');
      return raw ? JSON.parse(raw) : { course: 'Общее', tag: 'Общее' };
    } catch (e) { return { course: 'Общее', tag: 'Общее' }; }
  }

  function setLastChoice(course, tag) {
    try { localStorage.setItem('carnet-last-choice', JSON.stringify({ course, tag })); } catch (e) {}
  }

  function getCollapsedCourses() {
    try { return JSON.parse(localStorage.getItem('carnet-collapsed') || '[]'); } catch (e) { return []; }
  }
  function isCourseCollapsed(course) { return getCollapsedCourses().includes(course); }
  function toggleCourseCollapse(course) {
    let arr = getCollapsedCourses();
    if (arr.includes(course)) arr = arr.filter(c => c !== course);
    else arr.push(course);
    try { localStorage.setItem('carnet-collapsed', JSON.stringify(arr)); } catch (e) {}
  }

  async function grade(ok) {
    if (!current) return;
    let box, next;
    if (ok) {
      box = Math.min(current.box + 1, INTERVALS.length - 1);
      next = addDays(todayISO(), INTERVALS[box]);
      queue.shift();
    } else {
      box = 0;
      next = todayISO();
      const id = queue.shift();
      queue.splice(Math.min(2, queue.length), 0, id);
    }
    current.box = box;
    current.next = next;
    dbUpdateCard(current.id, { box: box, next: next }).catch(() => {});
    current = queue.length ? cards.find(c => c.id === queue[0]) : null;
    if (!current) { /* queue exhausted */ }
    flipped = false;
    render();
  }

  function stats(pool) {
    const t = todayISO();
    const p = pool || cards;
    return {
      due: p.filter(c => c.next <= t).length,
      novye: p.filter(c => c.box === 0).length,
      learned: p.filter(c => c.box === INTERVALS.length - 1).length,
      total: p.length
    };
  }

  function filteredPool() {
    let pool = courseFilter === 'Все' ? cards : cards.filter(c => c.course === courseFilter);
    if (courseFilter !== 'Все' && tagFilter !== 'Все') {
      pool = pool.filter(c => (c.tag || 'Общее') === tagFilter);
    }
    return pool;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function boxLabel(box) {
    if (box === 0) return 'новое';
    if (box === INTERVALS.length - 1) return 'выучено';
    return 'коробка ' + (box + 1);
  }

  function render() {
    if (loadError) {
      root.innerHTML = `
        <div class="carnet-header"><div class="carnet-title">carnet <span>de vocabulaire</span></div></div>
        <div class="stage">
          <div class="empty-state">
            <div class="big">Не удалось загрузить карточки</div>
            <div style="margin-bottom:16px">Проблема с подключением к базе — прогресс не потерян, просто не прочитался в этот раз.</div>
            <button class="submit-btn" style="max-width:220px" onclick="window.__retryLoad()">Повторить попытку</button>
          </div>
        </div>
      `;
      return;
    }

    if (sheetOpen === 'list') { renderListView(); return; }

    const s = stats(filteredPool());

    let stage = '';
    if (current) {
      stage = `
        <div class="card" onclick="window.__flip()">
          <div class="card-tag">${escapeHtml(current.course || '')} · ${escapeHtml(current.tag || '')}${isExtraMode ? ' · <span style="color:var(--brass-light)">вне графика</span>' : ''}</div>
          <div class="card-box">коробка ${current.box + 1}/5</div>
          ${flipped
            ? `<div class="card-word">${escapeHtml(current.back)}</div><div class="card-sub">${escapeHtml(current.tr || '')}</div>`
            : `<div class="card-word">${escapeHtml(current.front)}</div><div class="card-hint">нажми, чтобы открыть</div>`
          }
        </div>
        ${flipped ? `
          <div class="grade-row">
            <button class="grade-btn no" onclick="window.__grade(false)">Не помню</button>
            <button class="grade-btn yes" onclick="window.__grade(true)">Помню</button>
          </div>
        ` : ''}
      `;
    } else {
      const poolLen = filteredPool().length;
      stage = poolLen ? `
        <div class="empty-state">
          <div class="big">На этот заход всё пройдено</div>
          <div style="margin-bottom:16px">Можешь пройти этот же набор ещё раз.</div>
          <button class="submit-btn" style="max-width:200px" onclick="window.__restartQueue()">Попробовать снова</button>
        </div>
      ` : `
        <div class="empty-state">
          <div class="big">Здесь пока нет слов</div>
          <div>Добавь первое словом «+».</div>
        </div>
      `;
    }

    const courses = courseList();
    const filterRow = courses.length > 2 ? `
      <div class="filter-group" style="max-width:480px;margin:0 auto 22px">
        <div class="filter-label">Курс / пособие</div>
        <div class="tab-row" style="margin-bottom:0">
          ${courses.map(c => `<button class="tab-btn ${courseFilter === c ? 'active' : ''}" onclick="window.__setCourseFilter('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('')}
        </div>
      </div>
    ` : '';

    let tagFilterRow = '';
    if (courseFilter !== 'Все') {
      const tags = tagListForCourse(courseFilter);
      if (tags.length > 1) {
        tagFilterRow = `
          <div class="filter-group" style="max-width:480px;margin:0 auto 22px">
            <div class="filter-label">Урок / тема</div>
            <div class="tab-row" style="margin-bottom:0">
              ${['Все уроки'].concat(tags).map(t => `<button class="tab-btn ${(tagFilter === t || (tagFilter === 'Все' && t === 'Все уроки')) ? 'active' : ''}" onclick="window.__setTagFilter('${t === 'Все уроки' ? 'Все' : escapeHtml(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</button>`).join('')}
            </div>
          </div>
        `;
      }
    }

    root.innerHTML = `
      <div class="carnet-header">
        <div class="carnet-title">carnet <span>de vocabulaire</span></div>
        <button class="tab-btn" onclick="window.__openList()">Список слов</button>
      </div>
      <div class="carnet-stats">
        <div><b>${s.due}</b>к повторению</div>
        <div><b>${s.novye}</b>новых</div>
        <div><b>${s.learned}</b>выучено</div>
        <div><b>${s.total}</b>всего</div>
      </div>
      ${filterRow}
      ${tagFilterRow}
      <div class="stage">${stage}</div>
      <button class="fab" onclick="window.__openAdd()">+</button>
      ${sheetOpen === 'add' ? renderAddSheet() : ''}
    `;
  }

  function renderListView() {
    const s = stats(filteredPool());
    let pool = courseFilter === 'Все' ? cards : cards.filter(c => (c.course || 'Общее') === courseFilter);
    if (courseFilter !== 'Все' && tagFilter !== 'Все') {
      pool = pool.filter(c => (c.tag || 'Общее') === tagFilter);
    }
    const byCourse = {};
    for (const c of pool) {
      const course = c.course || 'Общее';
      if (!byCourse[course]) byCourse[course] = [];
      byCourse[course].push(c);
    }
    const courses = Object.keys(byCourse);

    const rows = courses.map(course => {
      const list = byCourse[course].slice().sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
      const collapsed = isCourseCollapsed(course);
      return `
        <div style="margin-bottom:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--ink-2);padding-bottom:6px;margin-bottom:${collapsed ? '0' : '10px'}"
               onclick="window.__toggleCourseCollapse('${escapeHtml(course).replace(/'/g, "\\'")}')">
            <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--text-light)">
              ${escapeHtml(course)} <span style="color:var(--text-dim);font-size:12px;font-weight:400">(${list.length})</span>
            </div>
            <div style="color:var(--text-dim);font-size:14px">${collapsed ? '▸' : '▾'}</div>
          </div>
          ${collapsed ? '' : `
            <div class="deck-list">
              ${list.map((c, i) => `
                <div class="deck-row">
                  <div>
                    <div class="ru">${escapeHtml(c.front)}</div>
                    <div class="fr">${escapeHtml(c.back)}${c.tr ? ' · ' + escapeHtml(c.tr) : ''}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="font-size:10px;color:var(--brass);border:1px solid var(--brass);border-radius:10px;padding:2px 8px;white-space:nowrap">${escapeHtml(c.tag || 'Общее')}</span>
                    <div style="color:${c.box === INTERVALS.length - 1 ? 'var(--green)' : 'var(--text-dim)'};font-size:11px;white-space:nowrap">${boxLabel(c.box)}</div>
                    <button onclick="window.__moveCard('${c.id}','${course.replace(/'/g, "\\'")}',-1)" ${i === 0 ? 'disabled style="opacity:0.25;background:none;border:none;font-size:14px;cursor:default;padding:2px 3px"' : 'style="background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:2px 3px"'} title="Выше">↑</button>
                    <button onclick="window.__moveCard('${c.id}','${course.replace(/'/g, "\\'")}',1)" ${i === list.length - 1 ? 'disabled style="opacity:0.25;background:none;border:none;font-size:14px;cursor:default;padding:2px 3px"' : 'style="background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:2px 3px"'} title="Ниже">↓</button>
                    <button onclick="window.__deleteCard('${c.id}')" style="background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;line-height:1;padding:2px 4px" title="Удалить">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }).join('');

    const allCourses = courseList();
    const filterRow = allCourses.length > 2 ? `
      <div class="filter-group" style="max-width:480px;margin:0 auto 22px">
        <div class="filter-label">Курс / пособие</div>
        <div class="tab-row" style="margin-bottom:0">
          ${allCourses.map(c => `<button class="tab-btn ${courseFilter === c ? 'active' : ''}" onclick="window.__setCourseFilter('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('')}
        </div>
      </div>
    ` : '';

    let tagFilterRowList = '';
    if (courseFilter !== 'Все') {
      const tags = tagListForCourse(courseFilter);
      if (tags.length > 1) {
        tagFilterRowList = `
          <div class="filter-group" style="max-width:480px;margin:0 auto 22px">
            <div class="filter-label">Урок / тема</div>
            <div class="tab-row" style="margin-bottom:0">
              ${['Все уроки'].concat(tags).map(t => `<button class="tab-btn ${(tagFilter === t || (tagFilter === 'Все' && t === 'Все уроки')) ? 'active' : ''}" onclick="window.__setTagFilter('${t === 'Все уроки' ? 'Все' : escapeHtml(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</button>`).join('')}
            </div>
          </div>
        `;
      }
    }

    root.innerHTML = `
      <div class="carnet-header">
        <div class="carnet-title">carnet <span>de vocabulaire</span></div>
        <button class="tab-btn" onclick="window.__closeList()">← Назад к карточкам</button>
      </div>
      <div class="carnet-stats">
        <div><b>${s.due}</b>к повторению</div>
        <div><b>${s.novye}</b>новых</div>
        <div><b>${s.learned}</b>выучено</div>
        <div><b>${s.total}</b>всего</div>
      </div>
      ${filterRow}
      ${tagFilterRowList}
      <div style="max-width:480px;margin:0 auto">
        ${rows || '<div class="empty-state">Пока пусто.</div>'}
      </div>
      <button class="fab" onclick="window.__openAdd()">+</button>
      ${sheetOpen === 'add' ? renderAddSheet() : ''}
    `;
  }

  function renderAddSheet() {
    const availableCourses = courseList().filter(c => c !== 'Все');
    const availableTags = tagListForCourse(formCourse);

    const courseField = formNewCourseMode
      ? `<div class="field"><label>Новый курс (название)</label><input id="f-course-new" placeholder="например: ИБ" autofocus /></div>`
      : `<div class="field"><label>Курс / источник</label>
          <select id="f-course-select" class="import-area" style="min-height:auto;padding:11px 12px" onchange="window.__courseSelectChange(this.value)">
            ${availableCourses.map(c => `<option value="${escapeHtml(c)}" ${c === formCourse ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
            <option value="__new__">+ Новый курс</option>
          </select>
        </div>`;

    const tagField = formNewTagMode
      ? `<div class="field"><label>Новая тема (название)</label><input id="f-tag-new" placeholder="например: урок 3" autofocus /></div>`
      : `<div class="field"><label>Тема / урок (внутри курса «${escapeHtml(formCourse)}»)</label>
          <select id="f-tag-select" class="import-area" style="min-height:auto;padding:11px 12px" onchange="window.__tagSelectChange(this.value)">
            ${availableTags.map(t => `<option value="${escapeHtml(t)}" ${t === formTag ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
            <option value="__new__">+ Новая тема</option>
          </select>
        </div>`;

    const oneTab = `
      <div class="field"><label>Русский (перевод)</label><input id="f-front" placeholder="например: заканчивать" /></div>
      <div class="field"><label>Французский</label><input id="f-back" placeholder="например: finir" /></div>
      <div class="field"><label>Произношение (кириллицей)</label><input id="f-tr" placeholder="например: фини́р" /></div>
      ${courseField}
      ${tagField}
      <button class="submit-btn" onclick="window.__submitAdd()">Добавить в карне</button>
      ${importResult ? `<div class="import-result">${escapeHtml(importResult)}</div>` : ''}
    `;

    const importTab = `
      <div class="import-hint">
        Формат — одна карточка на строку: <code>рус ; франц ; транскрипция ; курс ; тема</code>.
        Разделитель — точка с запятой. Если указать только 4 поля (без курса) — курс станет «Общее».
      </div>
      <label class="file-drop">
        📄 Выбрать .txt / .md файл
        <input type="file" id="f-file" accept=".txt,.md" style="display:none" onchange="window.__fileChosen(event)" />
      </label>
      <textarea class="import-area" id="f-bulk" placeholder="заканчивать ; finir ; фини́р ; Assimil ; урок 2"></textarea>
      <button class="submit-btn" onclick="window.__submitImport()">Импортировать</button>
      ${importResult ? `<div class="import-result">${escapeHtml(importResult)}</div>` : ''}
    `;

    return `
      <div class="overlay" onclick="window.__closeSheetBg(event)">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-title">Новые карточки <button class="sheet-close" onclick="window.__closeSheet()">✕</button></div>
          <div class="tab-row">
            <button class="tab-btn ${sheetTab === 'one' ? 'active' : ''}" onclick="window.__setTab('one')">Одна карточка</button>
            <button class="tab-btn ${sheetTab === 'import' ? 'active' : ''}" onclick="window.__setTab('import')">Импорт списком</button>
          </div>
          ${sheetTab === 'one' ? oneTab : importTab}
        </div>
      </div>
    `;
  }

  function parseBulkLocal(text, course_default) {
    const lines = text.split('\n');
    const newRows = [];
    let skipped = 0;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.includes('---')) continue;
      const parts = line.split(';').map(p => p.trim());
      if (parts.length < 2) { skipped++; continue; }
      let front, back, tr, course, tag;
      if (parts.length >= 5) {
        front = parts[0]; back = parts[1]; tr = parts[2] || ''; course = parts[3] || 'Общее'; tag = parts[4] || '';
      } else {
        front = parts[0]; back = parts[1]; tr = parts[2] || ''; tag = parts[3] || ''; course = 'Общее';
      }
      if (!front || !back || /^(рус|русский|front)$/i.test(front)) { skipped++; continue; }
      const dup = cards.some(c => c.front.toLowerCase() === front.toLowerCase() && c.back.toLowerCase() === back.toLowerCase())
        || newRows.some(c => c.front.toLowerCase() === front.toLowerCase() && c.back.toLowerCase() === back.toLowerCase());
      if (dup) { skipped++; continue; }
      newRows.push({ id: makeId(), front, back, tr, tag, course: course || 'Общее', box: 0, next: todayISO() });
    }
    return { newRows, skipped };
  }

  window.__flip = function () { flipped = !flipped; render(); };
  window.__setCourseFilter = function (c) { courseFilter = c; tagFilter = 'Все'; buildQueue(); render(); };
  window.__setTagFilter = function (t) { tagFilter = t; buildQueue(); render(); };
  window.__grade = function (ok) { grade(ok); };
  window.__openAdd = function () {
    sheetOpen = 'add'; sheetTab = 'one'; importResult = null;
    const last = getLastChoice();
    formCourse = courseList().includes(last.course) ? last.course : (courseList().filter(c => c !== 'Все')[0] || 'Общее');
    const tagsForCourse = tagListForCourse(formCourse);
    if (tagsForCourse.includes(last.tag)) {
      formTag = last.tag; formNewTagMode = false;
    } else if (tagsForCourse.length) {
      formTag = tagsForCourse[0]; formNewTagMode = false;
    } else {
      formTag = ''; formNewTagMode = true;
    }
    formNewCourseMode = false;
    render();
  };
  window.__courseSelectChange = function (val) {
    if (val === '__new__') { formNewCourseMode = true; }
    else {
      formCourse = val; formNewCourseMode = false;
      const tagsForCourse = tagListForCourse(val);
      if (tagsForCourse.length) { formTag = tagsForCourse[0]; formNewTagMode = false; }
      else { formTag = ''; formNewTagMode = true; }
    }
    render();
  };
  window.__tagSelectChange = function (val) {
    if (val === '__new__') { formNewTagMode = true; }
    else { formTag = val; formNewTagMode = false; }
    render();
  };
  window.__closeSheet = function () { sheetOpen = null; importResult = null; render(); };
  window.__closeSheetBg = function (e) { if (e.target.classList.contains('overlay')) { sheetOpen = null; importResult = null; render(); } };
  window.__setTab = function (t) { sheetTab = t; importResult = null; render(); };
  window.__openList = function () { sheetOpen = 'list'; render(); };
  window.__closeList = function () { sheetOpen = null; render(); };
  window.__toggleCourseCollapse = function (course) { toggleCourseCollapse(course); render(); };

  window.__moveCard = async function (id, course, dir) {
    const list = cards.filter(c => (c.course || 'Общее') === course).sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
    const idx = list.findIndex(c => c.id === id);
    const swapIdx = idx + dir;
    if (idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;
    const a = list[idx], b = list[swapIdx];
    const aTime = a.created_at, bTime = b.created_at;
    a.created_at = bTime; b.created_at = aTime;
    render();
    try {
      await Promise.all([
        dbUpdateCard(a.id, { created_at: bTime }),
        dbUpdateCard(b.id, { created_at: aTime })
      ]);
    } catch (e) {
      alert('Не удалось сохранить порядок: ' + e.message);
    }
  };

  window.__deleteCard = async function (id) {
    if (!confirm('Удалить эту карточку насовсем?')) return;
    try {
      await dbDeleteCard(id);
      cards = cards.filter(c => c.id !== id);
      buildQueue();
      render();
    } catch (e) {
      alert('Не удалось удалить: ' + e.message);
    }
  };

  window.__fileChosen = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const ta = document.getElementById('f-bulk');
      if (ta) ta.value = ev.target.result;
    };
    reader.readAsText(file, 'utf-8');
  };

  window.__submitImport = async function () {
    const ta = document.getElementById('f-bulk');
    const text = ta ? ta.value : '';
    if (!text.trim()) return;
    const { newRows, skipped } = parseBulkLocal(text);
    if (newRows.length) {
      cards = cards.concat(newRows);
      try { await dbInsertCards(newRows); } catch (e) {
        importResult = 'Ошибка сохранения в базу: ' + e.message;
        render();
        return;
      }
    }
    importResult = `Добавлено: ${newRows.length}. Пропущено: ${skipped}.`;
    buildQueue();
    render();
  };

  window.__submitAdd = async function () {
    const front = document.getElementById('f-front').value.trim();
    const back = document.getElementById('f-back').value.trim();
    const tr = document.getElementById('f-tr').value.trim();
    const course = (formNewCourseMode ? document.getElementById('f-course-new').value.trim() : formCourse) || 'Общее';
    const tag = (formNewTagMode ? document.getElementById('f-tag-new').value.trim() : formTag) || 'Общее';
    if (!front || !back || !course) return;

    const row = { id: makeId(), front, back, tr, tag, course, box: 0, next: todayISO() };
    cards.push(row);
    try { await dbInsertCards([row]); } catch (e) {
      importResult = 'Ошибка сохранения: ' + e.message;
      render();
      return;
    }

    setLastChoice(course, tag);
    formCourse = course; formTag = tag; formNewCourseMode = false; formNewTagMode = false;
    importResult = `Добавлено: «${front}». Можно сразу добавить следующее — курс и тема остались прежними.`;
    buildQueue();
    render();
    // clear only the word fields for fast repeated entry, keep course/tag selection
    const fF = document.getElementById('f-front'), fB = document.getElementById('f-back'), fT = document.getElementById('f-tr');
    if (fF) fF.value = ''; if (fB) fB.value = ''; if (fT) fT.value = '';
    if (fF) fF.focus();
  };

  load();

  // ---- Class schedule countdown (independent of the main app) ----
  const SCHEDULE = [
    { label: 'Попказ', day: 2, hour: 14, minute: 30, room: 'ауд. 416, Остоженка д.3б', lastDate: '2026-12-29' },
    { label: 'ИБ', day: 3, hour: 15, minute: 10, room: 'ауд. 22, Ростокинский пр-д. 13а', lastDate: '2027-01-13' }
  ];

  function nextClassDate(item) {
    const now = new Date();
    const last = new Date(item.lastDate + 'T23:59:59');
    let d = new Date(now);
    d.setHours(item.hour, item.minute, 0, 0);
    const diffDays = (item.day - now.getDay() + 7) % 7;
    d.setDate(now.getDate() + diffDays);
    if (d <= now) d.setDate(d.getDate() + 7);
    if (d > last) return null;
    return d;
  }

  function formatCountdown(target) {
    const ms = target - new Date();
    if (ms <= 0) return 'сейчас';
    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(totalMin / (60 * 24));
    const hours = Math.floor((totalMin % (60 * 24)) / 60);
    const mins = totalMin % 60;
    if (days > 0) return `через ${days}д ${hours}ч`;
    if (hours > 0) return `через ${hours}ч ${mins}м`;
    return `через ${mins}м`;
  }

  function renderScheduleBar() {
    const bar = document.getElementById('schedule-bar');
    if (!bar) return;
    bar.innerHTML = SCHEDULE.map(item => {
      const next = nextClassDate(item);
      const countdown = next ? formatCountdown(next) : 'пары закончились';
      return `
        <div class="schedule-row">
          <span class="label">${item.label}</span>
          <span class="room">${item.room}</span>
          <span class="countdown">${countdown}</span>
        </div>
      `;
    }).join('');
  }

  renderScheduleBar();
  setInterval(renderScheduleBar, 30000);
})();
</script>
</body>
</html>
