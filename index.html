<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnet de vocabulaire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .carnet-root {
    --ink: #1b2430;
    --ink-2: #242f3f;
    --parchment: #ede6d6;
    --parchment-2: #e2d9c3;
    --brass: #b8935f;
    --brass-light: #d4b483;
    --red: #b8433a;
    --green: #6f8f6a;
    --text-light: #f2ede1;
    --text-dim: #9aa4b2;

    font-family: 'IBM Plex Mono', monospace;
    background: var(--ink);
    color: var(--text-light);
    min-height: 100vh;
    padding: 32px 16px 100px;
    position: relative;
  }

  .carnet-header {
    max-width: 480px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--ink-2);
    padding-bottom: 14px;
  }

  .carnet-title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--text-light);
    letter-spacing: 0.2px;
  }

  .carnet-title span {
    color: var(--brass-light);
    font-style: italic;
  }

  .carnet-stats {
    max-width: 480px;
    margin: 0 auto 28px;
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .carnet-stats b {
    color: var(--text-light);
    font-size: 15px;
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
  }

  .stage {
    max-width: 480px;
    margin: 0 auto;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 400px;
    min-height: 220px;
    background: var(--parchment);
    color: var(--ink);
    border-radius: 3px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.5);
    position: relative;
    transition: transform 0.15s ease;
    border: 1px solid var(--parchment-2);
  }

  .card:active { transform: scale(0.985); }

  .card-tag {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--brass);
    font-weight: 600;
  }

  .card-box {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 10px;
    color: #8a8272;
  }

  .card-word {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .card-sub {
    font-size: 13px;
    color: #6b6455;
    font-style: italic;
  }

  .card-hint {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #a89f8a;
    text-transform: uppercase;
  }

  .grade-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    margin-top: 18px;
  }

  .grade-btn {
    flex: 1;
    padding: 15px 0;
    border-radius: 3px;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  .grade-btn.no { background: rgba(184,67,58,0.15); color: #e08b83; border: 1px solid rgba(184,67,58,0.4); }
  .grade-btn.yes { background: rgba(111,143,106,0.18); color: #a9c7a2; border: 1px solid rgba(111,143,106,0.4); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    max-width: 320px;
  }

  .empty-state .big {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .fab {
    position: fixed;
    bottom: 28px;
    right: 50%;
    transform: translateX(228px);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--brass);
    color: var(--ink);
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.6);
  }

  @media (max-width: 540px) {
    .fab { right: 24px; transform: none; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,20,0.85);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }

  .sheet {
    background: var(--ink-2);
    width: 100%;
    max-width: 480px;
    border-radius: 14px 14px 0 0;
    padding: 24px 20px 32px;
    max-height: 86vh;
    overflow-y: auto;
  }

  .sheet-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sheet-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    letter-spacing: 0.03em;
  }

  .field input {
    width: 100%;
    background: var(--ink);
    border: 1px solid #3a4658;
    color: var(--text-light);
    padding: 11px 12px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }

  .field input:focus { outline: 1px solid var(--brass); border-color: var(--brass); }

  .submit-btn {
    width: 100%;
    padding: 13px 0;
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }

  .deck-list { margin-top: 4px; }

  .deck-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #2c3646;
    font-size: 13px;
  }

  .deck-row .fr { font-family: 'Fraunces', serif; font-size: 15px; }
  .deck-row .ru { color: var(--text-dim); }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: none;
    border: 1px solid #3a4658;
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }

  .tab-btn.active { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 600; }

  .import-area {
    width: 100%;
    min-height: 140px;
    background: var(--ink);
    border: 1px solid #3a4658;
    color: var(--text-light);
    padding: 11px 12px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    resize: vertical;
  }
  .import-area:focus { outline: 1px solid var(--brass); border-color: var(--brass); }

  .import-hint {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .import-hint code {
    background: #10151d;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--brass-light);
  }

  .file-drop {
    border: 1px dashed #3a4658;
    border-radius: 4px;
    padding: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
    cursor: pointer;
    display: block;
  }
  .file-drop:hover { border-color: var(--brass); color: var(--text-light); }

  .import-result {
    margin-top: 12px;
    font-size: 12px;
    color: var(--brass-light);
  }

  .loading { text-align: center; color: var(--text-dim); padding: 60px 0; }
</style>
</head>
<body>
<div class="carnet-root" id="root">
  <div class="loading">Открываю карне...</div>
</div>

<script>
(function () {
  // ---- Supabase connection ----
  const SUPA_URL = 'https://bbtnermtgmceczxjzhbl.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJidG5lcm10Z21jZWN6eGp6aGJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTg1NjcsImV4cCI6MjEwNDM5NDU2N30.fJp51af9yFuCVSSceX8BT4TmhXdzxHuy9UvFWYG-cec';

  function supaHeaders(extra) {
    return Object.assign({
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  async function dbFetchCards() {
    const res = await fetch(SUPA_URL + '/rest/v1/cards?select=*', { headers: supaHeaders() });
    if (!res.ok) throw new Error('fetch cards failed: ' + res.status);
    return await res.json();
  }

  async function dbInsertCards(rows) {
    if (!rows || !rows.length) return;
    const res = await fetch(SUPA_URL + '/rest/v1/cards', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify(rows)
    });
    if (!res.ok) throw new Error('insert failed: ' + await res.text());
  }

  async function dbUpdateCard(id, patch) {
    const res = await fetch(SUPA_URL + '/rest/v1/cards?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: supaHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify(patch)
    });
    if (!res.ok) throw new Error('update failed: ' + await res.text());
  }

  async function dbGetMeta(key) {
    const res = await fetch(SUPA_URL + '/rest/v1/meta?key=eq.' + encodeURIComponent(key) + '&select=value', { headers: supaHeaders() });
    if (!res.ok) throw new Error('meta fetch failed');
    const arr = await res.json();
    return arr.length ? arr[0].value : null;
  }

  async function dbSetMeta(key, value) {
    const res = await fetch(SUPA_URL + '/rest/v1/meta', {
      method: 'POST',
      headers: supaHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ key: key, value: value }])
    });
    if (!res.ok) throw new Error('meta set failed: ' + await res.text());
  }

  // ---- App logic (same shape as the in-chat version) ----
  const INTERVALS = [0, 1, 3, 7, 16]; // days, by box index 0-4

  const AUTO_IMPORT = [
    { id: 'test-version-check-1', tag: 'проверка версии', course: 'Тест', words: [
      { front: 'тестовое слово', back: 'mot test', tr: 'мо тэст' },
    ]},
  ];

  const STARTER = [
    { front: 'телевизор', back: 'la télé', tr: 'ля тэлэ', tag: 'урок 1', course: 'Assimil' },
    { front: 'звонить', back: 'téléphoner', tr: 'тэлефонэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'искать', back: 'chercher', tr: 'шершэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'друзья', back: 'les amis', tr: 'лезами́', tag: 'урок 1', course: 'Assimil' },
    { front: 'деревня', back: 'la campagne', tr: 'ля кампа́нь', tag: 'урок 1', course: 'Assimil' },
    { front: 'думать', back: 'penser', tr: 'пансэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'экзамены', back: 'les examens', tr: 'лезэгзамэ́н', tag: 'урок 1', course: 'Assimil' },
    { front: 'слушать', back: 'écouter', tr: 'экутэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'преподаватель', back: 'le professeur', tr: 'ля профэсёр', tag: 'урок 1', course: 'Assimil' },
    { front: 'заканчивать', back: 'finir', tr: 'фини́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'приходить', back: 'venir', tr: 'вёни́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'писать', back: 'écrire', tr: 'экри́р', tag: 'урок 1', course: 'Assimil' },
    { front: 'покупать', back: 'acheter', tr: 'аштэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'книга', back: 'le livre', tr: 'лё ливр', tag: 'урок 1', course: 'Assimil' },
    { front: 'говорить', back: 'parler', tr: 'парлэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'брат', back: 'le frère', tr: 'лё фрэр', tag: 'урок 1', course: 'Assimil' },
    { front: 'работать', back: 'travailler', tr: 'травайе́', tag: 'урок 1', course: 'Assimil' },
    { front: 'приезжать', back: 'arriver', tr: 'аривэ́', tag: 'урок 1', course: 'Assimil' },
    { front: 'завтра', back: 'demain', tr: 'дёмэ́н', tag: 'урок 1', course: 'Assimil' },
    { front: 'жить (где-то)', back: 'habiter', tr: 'абитэ́', tag: 'урок 1', course: 'Assimil' }
  ];

  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function makeId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  let cards = [];
  let queue = [];
  let current = null;
  let flipped = false;
  let sheetOpen = null; // null | 'add' | 'list'
  let sheetTab = 'one'; // 'one' | 'import'
  let importResult = null;
  let courseFilter = 'Все';
  let loadError = false;

  const root = document.getElementById('root');

  async function load() {
    try {
      cards = await dbFetchCards();
      loadError = false;
    } catch (e) {
      loadError = true;
      render();
      return;
    }

    if (cards.length === 0) {
      let initialized = null;
      try { initialized = await dbGetMeta('initialized'); } catch (e) {}
      if (!initialized) {
        const seedRows = STARTER.map(c => ({
          id: makeId(), front: c.front, back: c.back, tr: c.tr, tag: c.tag,
          course: c.course || 'Общее', box: 0, next: todayISO()
        }));
        try {
          await dbInsertCards(seedRows);
          await dbSetMeta('initialized', '1');
          cards = seedRows;
        } catch (e) {}
      }
    }

    await applyAutoImports();
    buildQueue();
    render();
  }

  window.__retryLoad = function () { root.innerHTML = '<div class="loading">Пробую снова...</div>'; load(); };

  async function applyAutoImports() {
    if (!AUTO_IMPORT.length) return;
    let doneIds = [];
    try {
      const raw = await dbGetMeta('auto_import_log');
      doneIds = raw ? JSON.parse(raw) : [];
    } catch (e) { doneIds = []; }

    const newRows = [];
    for (const batch of AUTO_IMPORT) {
      if (doneIds.includes(batch.id)) continue;
      for (const w of batch.words) {
        const dup = cards.some(c => c.front.toLowerCase() === w.front.toLowerCase() && c.back.toLowerCase() === w.back.toLowerCase());
        if (dup) continue;
        newRows.push({ id: makeId(), front: w.front, back: w.back, tr: w.tr || '', tag: batch.tag || '', course: batch.course || 'Общее', box: 0, next: todayISO() });
      }
      doneIds.push(batch.id);
    }
    if (newRows.length) {
      try {
        await dbInsertCards(newRows);
        cards = cards.concat(newRows);
      } catch (e) {}
    }
    try { await dbSetMeta('auto_import_log', JSON.stringify(doneIds)); } catch (e) {}
  }

  function buildQueue() {
    const t = todayISO();
    cards.forEach(c => { if (!c.course) c.course = 'Общее'; });
    const pool = courseFilter === 'Все' ? cards : cards.filter(c => c.course === courseFilter);
    queue = pool.filter(c => c.next <= t).map(c => c.id);
    current = queue.length ? cards.find(c => c.id === queue[0]) : null;
    flipped = false;
  }

  function courseList() {
    const set = new Set(cards.map(c => c.course || 'Общее'));
    return ['Все'].concat(Array.from(set).sort());
  }

  async function grade(ok) {
    if (!current) return;
    let box, next;
    if (ok) {
      box = Math.min(current.box + 1, INTERVALS.length - 1);
      next = addDays(todayISO(), INTERVALS[box]);
      queue.shift();
    } else {
      box = 0;
      next = todayISO();
      const id = queue.shift();
      queue.splice(Math.min(2, queue.length), 0, id);
    }
    current.box = box;
    current.next = next;
    dbUpdateCard(current.id, { box: box, next: next }).catch(() => {});
    current = queue.length ? cards.find(c => c.id === queue[0]) : null;
    flipped = false;
    render();
  }

  function stats() {
    const t = todayISO();
    return {
      due: cards.filter(c => c.next <= t).length,
      novye: cards.filter(c => c.box === 0).length,
      learned: cards.filter(c => c.box === INTERVALS.length - 1).length,
      total: cards.length
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function boxLabel(box) {
    if (box === 0) return 'новое';
    if (box === INTERVALS.length - 1) return 'выучено';
    return 'коробка ' + (box + 1);
  }

  function render() {
    if (loadError) {
      root.innerHTML = `
        <div class="carnet-header"><div class="carnet-title">carnet <span>de vocabulaire</span></div></div>
        <div class="stage">
          <div class="empty-state">
            <div class="big">Не удалось загрузить карточки</div>
            <div style="margin-bottom:16px">Проблема с подключением к базе — прогресс не потерян, просто не прочитался в этот раз.</div>
            <button class="submit-btn" style="max-width:220px" onclick="window.__retryLoad()">Повторить попытку</button>
          </div>
        </div>
      `;
      return;
    }

    if (sheetOpen === 'list') { renderListView(); return; }

    const s = stats();

    let stage = '';
    if (current) {
      stage = `
        <div class="card" onclick="window.__flip()">
          <div class="card-tag">${escapeHtml(current.course || '')} · ${escapeHtml(current.tag || '')}</div>
          <div class="card-box">коробка ${current.box + 1}/5</div>
          ${flipped
            ? `<div class="card-word">${escapeHtml(current.back)}</div><div class="card-sub">${escapeHtml(current.tr || '')}</div>`
            : `<div class="card-word">${escapeHtml(current.front)}</div><div class="card-hint">нажми, чтобы открыть</div>`
          }
        </div>
        ${flipped ? `
          <div class="grade-row">
            <button class="grade-btn no" onclick="window.__grade(false)">Не помню</button>
            <button class="grade-btn yes" onclick="window.__grade(true)">Помню</button>
          </div>
        ` : ''}
      `;
    } else {
      stage = `
        <div class="empty-state">
          <div class="big">На сегодня всё повторено</div>
          <div>Новые карточки появятся здесь, когда подойдёт их срок — или добавь новые словом «+».</div>
        </div>
      `;
    }

    const courses = courseList();
    const filterRow = courses.length > 2 ? `
      <div class="tab-row" style="max-width:480px;margin:0 auto 18px">
        ${courses.map(c => `<button class="tab-btn ${courseFilter === c ? 'active' : ''}" onclick="window.__setCourseFilter('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('')}
      </div>
    ` : '';

    root.innerHTML = `
      <div class="carnet-header">
        <div class="carnet-title">carnet <span>de vocabulaire</span></div>
        <button class="tab-btn" onclick="window.__openList()">Список слов</button>
      </div>
      <div class="carnet-stats">
        <div><b>${s.due}</b>к повторению</div>
        <div><b>${s.novye}</b>новых</div>
        <div><b>${s.learned}</b>выучено</div>
        <div><b>${s.total}</b>всего</div>
      </div>
      ${filterRow}
      <div class="stage">${stage}</div>
      <button class="fab" onclick="window.__openAdd()">+</button>
      ${sheetOpen === 'add' ? renderAddSheet() : ''}
    `;
  }

  function renderListView() {
    const s = stats();
    const byCourse = {};
    for (const c of cards) {
      const course = c.course || 'Общее';
      const tag = c.tag || 'без темы';
      if (!byCourse[course]) byCourse[course] = {};
      if (!byCourse[course][tag]) byCourse[course][tag] = [];
      byCourse[course][tag].push(c);
    }
    const courses = Object.keys(byCourse);

    const rows = courses.map(course => {
      const tagGroups = byCourse[course];
      const tagKeys = Object.keys(tagGroups);
      const total = tagKeys.reduce((n, t) => n + tagGroups[t].length, 0);
      return `
        <div style="margin-bottom:28px">
          <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--text-light);margin-bottom:10px;border-bottom:1px solid var(--ink-2);padding-bottom:6px">
            ${escapeHtml(course)} <span style="color:var(--text-dim);font-size:12px;font-weight:400">(${total})</span>
          </div>
          ${tagKeys.map(tag => `
            <div style="margin-bottom:14px">
              <div style="font-family:'Fraunces',serif;font-size:13px;color:var(--brass-light);margin-bottom:4px">
                ${escapeHtml(tag)} <span style="color:var(--text-dim);font-size:11px">(${tagGroups[tag].length})</span>
              </div>
              <div class="deck-list">
                ${tagGroups[tag].map(c => `
                  <div class="deck-row">
                    <div>
                      <div class="ru">${escapeHtml(c.front)}</div>
                      <div class="fr">${escapeHtml(c.back)}${c.tr ? ' · ' + escapeHtml(c.tr) : ''}</div>
                    </div>
                    <div style="color:${c.box === INTERVALS.length - 1 ? 'var(--green)' : 'var(--text-dim)'};font-size:11px">${boxLabel(c.box)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');

    root.innerHTML = `
      <div class="carnet-header">
        <div class="carnet-title">carnet <span>de vocabulaire</span></div>
        <button class="tab-btn" onclick="window.__closeList()">← Назад к карточкам</button>
      </div>
      <div class="carnet-stats">
        <div><b>${s.due}</b>к повторению</div>
        <div><b>${s.novye}</b>новых</div>
        <div><b>${s.learned}</b>выучено</div>
        <div><b>${s.total}</b>всего</div>
      </div>
      <div style="max-width:480px;margin:0 auto">
        ${rows || '<div class="empty-state">Пока пусто.</div>'}
      </div>
      <button class="fab" onclick="window.__openAdd()">+</button>
      ${sheetOpen === 'add' ? renderAddSheet() : ''}
    `;
  }

  function renderAddSheet() {
    const oneTab = `
      <div class="field"><label>Русский (перевод)</label><input id="f-front" placeholder="например: заканчивать" /></div>
      <div class="field"><label>Французский</label><input id="f-back" placeholder="например: finir" /></div>
      <div class="field"><label>Произношение (кириллицей)</label><input id="f-tr" placeholder="например: фини́р" /></div>
      <div class="field"><label>Курс / источник</label><input id="f-course" placeholder="например: Попказ, ИБ, Assimil, Общее" /></div>
      <div class="field"><label>Тема / урок</label><input id="f-tag" placeholder="например: урок 2" /></div>
      <button class="submit-btn" onclick="window.__submitAdd()">Добавить в карне</button>
    `;

    const importTab = `
      <div class="import-hint">
        Формат — одна карточка на строку: <code>рус ; франц ; транскрипция ; курс ; тема</code>.
        Разделитель — точка с запятой. Если указать только 4 поля (без курса) — курс станет «Общее».
      </div>
      <label class="file-drop">
        📄 Выбрать .txt / .md файл
        <input type="file" id="f-file" accept=".txt,.md" style="display:none" onchange="window.__fileChosen(event)" />
      </label>
      <textarea class="import-area" id="f-bulk" placeholder="заканчивать ; finir ; фини́р ; Assimil ; урок 2"></textarea>
      <button class="submit-btn" onclick="window.__submitImport()">Импортировать</button>
      ${importResult ? `<div class="import-result">${escapeHtml(importResult)}</div>` : ''}
    `;

    return `
      <div class="overlay" onclick="window.__closeSheetBg(event)">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-title">Новые карточки <button class="sheet-close" onclick="window.__closeSheet()">✕</button></div>
          <div class="tab-row">
            <button class="tab-btn ${sheetTab === 'one' ? 'active' : ''}" onclick="window.__setTab('one')">Одна карточка</button>
            <button class="tab-btn ${sheetTab === 'import' ? 'active' : ''}" onclick="window.__setTab('import')">Импорт списком</button>
          </div>
          ${sheetTab === 'one' ? oneTab : importTab}
        </div>
      </div>
    `;
  }

  function parseBulkLocal(text, course_default) {
    const lines = text.split('\n');
    const newRows = [];
    let skipped = 0;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.includes('---')) continue;
      const parts = line.split(';').map(p => p.trim());
      if (parts.length < 2) { skipped++; continue; }
      let front, back, tr, course, tag;
      if (parts.length >= 5) {
        front = parts[0]; back = parts[1]; tr = parts[2] || ''; course = parts[3] || 'Общее'; tag = parts[4] || '';
      } else {
        front = parts[0]; back = parts[1]; tr = parts[2] || ''; tag = parts[3] || ''; course = 'Общее';
      }
      if (!front || !back || /^(рус|русский|front)$/i.test(front)) { skipped++; continue; }
      const dup = cards.some(c => c.front.toLowerCase() === front.toLowerCase() && c.back.toLowerCase() === back.toLowerCase())
        || newRows.some(c => c.front.toLowerCase() === front.toLowerCase() && c.back.toLowerCase() === back.toLowerCase());
      if (dup) { skipped++; continue; }
      newRows.push({ id: makeId(), front, back, tr, tag, course: course || 'Общее', box: 0, next: todayISO() });
    }
    return { newRows, skipped };
  }

  window.__flip = function () { flipped = !flipped; render(); };
  window.__setCourseFilter = function (c) { courseFilter = c; buildQueue(); render(); };
  window.__grade = function (ok) { grade(ok); };
  window.__openAdd = function () { sheetOpen = 'add'; sheetTab = 'one'; importResult = null; render(); };
  window.__closeSheet = function () { sheetOpen = null; importResult = null; render(); };
  window.__closeSheetBg = function (e) { if (e.target.classList.contains('overlay')) { sheetOpen = null; importResult = null; render(); } };
  window.__setTab = function (t) { sheetTab = t; importResult = null; render(); };
  window.__openList = function () { sheetOpen = 'list'; render(); };
  window.__closeList = function () { sheetOpen = null; render(); };

  window.__fileChosen = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const ta = document.getElementById('f-bulk');
      if (ta) ta.value = ev.target.result;
    };
    reader.readAsText(file, 'utf-8');
  };

  window.__submitImport = async function () {
    const ta = document.getElementById('f-bulk');
    const text = ta ? ta.value : '';
    if (!text.trim()) return;
    const { newRows, skipped } = parseBulkLocal(text);
    if (newRows.length) {
      cards = cards.concat(newRows);
      try { await dbInsertCards(newRows); } catch (e) {
        importResult = 'Ошибка сохранения в базу: ' + e.message;
        render();
        return;
      }
    }
    importResult = `Добавлено: ${newRows.length}. Пропущено: ${skipped}.`;
    buildQueue();
    render();
  };

  window.__submitAdd = async function () {
    const front = document.getElementById('f-front').value.trim();
    const back = document.getElementById('f-back').value.trim();
    const tr = document.getElementById('f-tr').value.trim();
    const course = document.getElementById('f-course').value.trim() || 'Общее';
    const tag = document.getElementById('f-tag').value.trim();
    if (!front || !back) return;
    const row = { id: makeId(), front, back, tr, tag, course, box: 0, next: todayISO() };
    cards.push(row);
    try { await dbInsertCards([row]); } catch (e) { console.error(e); }
    sheetOpen = null;
    buildQueue();
    render();
  };

  load();
})();
</script>
</body>
</html>
